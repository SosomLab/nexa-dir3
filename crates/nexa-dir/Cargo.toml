[package]
name = "nexa-dir"
# bin이 둘(nexa-dir · 콘솔 보조 ndir · T-178) — `cargo run -p nexa-dir`(게이트 · CI · 문서)이 본체를 고르게(10-08 gate full smoke 실패).
default-run = "nexa-dir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Nexa Dir - lightweight dual-panel file explorer for Windows, macOS and Linux (app binary; winit host drawing on nexa-ui; --smoke, --selfcheck)"
# Windows 실행 파일 아이콘·버전 리소스 — rc.exe/windres가 있을 때만 · 외부 crate 0 · 다른 OS 불변(nexa-sql T-62 복사).
build = "build.rs"

[lints]
workspace = true

[dependencies]
ndir-core = { workspace = true }
ndir-vfs = { workspace = true }
ndir-tree = { workspace = true }
ndir-term = { workspace = true }
# 파일 작업 엔진(전송 · undo/redo · 일괄 이름 변경 — M6).
ndir-ops = { workspace = true }
# WASM 플러그인 런타임(DR-7 · dir2 ABI 바이트 호환).
wasmi = { workspace = true }
ndir-i18n = { workspace = true }
ndir-settings = { workspace = true }
ndir-license = { workspace = true }
ndir-log = { workspace = true }
nexa-gfx = { workspace = true }
nexa-ctl = { workspace = true }
nexa-fs = { workspace = true }
# 파일/폴더 고르기 창(FilePicker · T-29 B · T-80 라이선스 파일 열기).
nexa-dlg = { workspace = true }
# 세션 디바운스 저장(`SaveScheduler` quiet 1 s + max_delay 5 s — dir2 PREFS-051·617).
nexa-conf = { workspace = true }
nexa-font = { workspace = true }
nexa-grid = { workspace = true }
nexa-explorer = { workspace = true }
# OS 신호 — 입력 소스(한글 조합 방식) · macOS IOSurface present(`nexa_sys::layer_present`).
nexa-sys = { workspace = true, features = ["gui"] }
# 창·입력(winit) + CPU 픽셀 제출(softbuffer) — nexa-sql과 같은 판(실증 조합 · DR-1). Linux는 Wayland/X11 런타임 dlopen.
winit = { version = "0.30", features = ["wayland-dlopen"] }
softbuffer = { version = "0.4", features = ["wayland-dlopen"] }

# ── Windows: 셸 컨텍스트 메뉴(IContextMenu · T-51 B) · 폴더 감시(ReadDirectoryChangesW · T-51 B-2b) — DR-8 허용 OS 바인딩 · dir2와 같은 판(0.62).
[target.'cfg(windows)'.dependencies]
# `#[implement]` 매크로가 펼친 코드가 `::windows_core` 경로를 직접 가리킨다(OLE 드래그 발신 `platform/windrag.rs` · dir2 동일 ·
# windows 크레이트가 이미 끌어오는 같은 판 — 의존 트리 증가 0).
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# ── Linux: 모달 창을 메인의 transient(WM_TRANSIENT_FOR + _NET_WM_STATE_MODAL)로 · X11 클립보드 직접(nexa-sql docs/61 §3 · DR-3 예외).
[dev-dependencies]
# 시험 전용 — WAT 텍스트 모듈 조립(격리·브레이커·ABI v2 시험 · dir2 동일 · docs/10 §3).
wat = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

# ── macOS: Dock 아이콘(`icon::set_dock_icon`) — winit과 같은 판(objc2 0.5 · app-kit/foundation 0.2 · 의존 트리 중복 0).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSWindow",
    "NSView",
    "NSGraphics",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSGeometry",
    "NSThread",
    "NSArray",
    "NSDictionary",
    "NSEnumerator",
    "NSURL",
    "NSError",
    "NSFileManager",
] }
