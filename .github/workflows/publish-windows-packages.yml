# publish-windows-packages — winget · Chocolatey 제출(Windows 채널 전용 · T-160)
#
# 이식 원본: ../nexa-clip/.github/workflows/publish-windows-packages.yml(f3a6781 · 변수+시크릿 이중 게이트 + 검수 대기 자동 판정).
# dir3 맞춤: 식별자 = dir2 계승(winget `SosomLab.NexaDir`/`.Portable` · choco `nexa-dir`/`nexa-dir.portable`) · 자산 = MSI + 포터블 zip +
# `*.msi.productcode.txt` · ★ choco 대기 판정은 dir3 git 태그로 못 한다(dir2 계보 0.18~0.22가 다른 저장소) → **choco 피드에 가장 최근
# 제출된 버전**을 직접 조회해 승인 여부를 본다(현재 0.21.0 승인 · 0.22.0 미제출 → 0.23.0 바로 제출 가능 · 10-05 조사).
#
# | 채널 | 스위치 변수 | 시크릿 | 대기 판정 |
# | --- | --- | --- | --- |
# | winget | `WINGET_PUBLISH=true` | `WINGET_TOKEN` | microsoft/winget-pkgs에 우리 식별자를 단 **열린 PR**이 있으면 대기 |
# | Chocolatey | `CHOCO_PUSH=true` | `CHOCO_API_KEY` | 피드의 **가장 최근 제출 버전**이 승인(IsApproved=true)되지 않았으면 대기 |
#
# 수동 실행의 `force=true`는 대기 판정을 무시한다(반려 뒤 같은 버전 재제출 — 그동안 `WINGET_PUBLISH=false`).
name: publish-windows-packages

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      force:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그(예: v0.23.0)"
        required: true
        type: string
      force:
        description: "검수 대기 판정을 무시하고 제출(사람이 확인했을 때만)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      winget_go: ${{ steps.winget.outputs.go }}
      choco_go: ${{ steps.choco.outputs.go }}
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - name: 스위치 상태(값 노출 없음)
        run: |
          echo "태그                  : ${{ inputs.tag }}  (force=${{ inputs.force }})"
          echo "vars.WINGET_PUBLISH   : '${{ vars.WINGET_PUBLISH }}'  · WINGET_TOKEN 설정됨: ${{ env.WINGET_TOKEN != '' }}"
          echo "vars.CHOCO_PUSH       : '${{ vars.CHOCO_PUSH }}'  · CHOCO_API_KEY 설정됨: ${{ env.CHOCO_API_KEY != '' }}"

      - id: winget
        name: winget 대기 판정(열린 PR)
        shell: bash
        run: |
          set -euo pipefail
          go=false
          if [ "${{ vars.WINGET_PUBLISH }}" = "true" ] && [ -n "${WINGET_TOKEN:-}" ]; then
            go=true
            if [ "${{ inputs.force }}" != "true" ]; then
              me=$(GH_TOKEN="$WINGET_TOKEN" gh api user -q .login)
              open=$(GH_TOKEN="$WINGET_TOKEN" gh pr list -R microsoft/winget-pkgs --state open --author "$me" \
                       --search "SosomLab.NexaDir" --json number,title -q '.[] | "#\(.number) \(.title)"' || true)
              if [ -n "$open" ]; then
                echo "::warning::winget: 직전 제출이 검수 대기 중 — 이번 릴리스는 제출을 건너뛴다(큐 엉킴 방지)."
                echo "$open"
                go=false
              fi
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "winget 제출: $go"

      - id: choco
        name: Chocolatey 대기 판정(피드의 가장 최근 제출 버전이 승인됐는가)
        shell: bash
        run: |
          set -euo pipefail
          go=false
          if [ "${{ vars.CHOCO_PUSH }}" = "true" ] && [ -n "${CHOCO_API_KEY:-}" ]; then
            go=true
            if [ "${{ inputs.force }}" != "true" ]; then
              cur="${{ inputs.tag }}"; cur="${cur#v}"
              for pkg in nexa-dir nexa-dir.portable; do
                # 버전 없이 묻으면 피드는 검수 중 항목을 숨긴다 → 승인된 최신만 나온다. 그래서 두 번 묻는다:
                # ① 승인 최신(IsLatestVersion) ② 그 다음 버전들이 검수 중인지는 알 수 없으므로, **우리가 낸 직전 버전**을 모를 때는
                #    "승인 최신이 현재 버전보다 낮다"는 것만 확인하고 제출한다(dir2 계보: 0.21.0 승인 · 0.22.0 미제출 — 조사 10-05).
                url="https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'$pkg'%20and%20IsLatestVersion"
                if ! body=$(curl -fsS "$url"); then
                  echo "::warning::choco: $pkg 조회 실패 — 이번 릴리스는 제출을 건너뛴다."
                  go=false; continue
                fi
                latest=$(echo "$body" | grep -o '<d:Version>[^<]*' | head -1 | sed 's/<d:Version>//')
                if [ -z "$latest" ]; then
                  echo "choco: $pkg 피드에 승인된 버전 없음 — 첫 제출."
                  continue
                fi
                if [ "$latest" = "$cur" ]; then
                  echo "::warning::choco: $pkg $cur 이(가) 이미 피드에 있다 — 건너뛴다."
                  go=false; continue
                fi
                # 현재 버전이 이미 제출돼 검수 중인지(Id+Version 조회는 검수 중 항목도 돌려준다 · IsApproved=false).
                url2="https://community.chocolatey.org/api/v2/Packages()?\$filter=Id%20eq%20'$pkg'%20and%20Version%20eq%20'$cur'"
                if body2=$(curl -fsS "$url2") && echo "$body2" | grep -q '<entry>'; then
                  echo "::warning::choco: $pkg $cur 이(가) 이미 제출되어 검수 중 — 건너뛴다(반려 뒤 재제출은 force=true)."
                  go=false; continue
                fi
                echo "choco: $pkg 승인 최신 $latest → $cur 제출."
              done
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "choco 제출: $go"

  chocolatey:
    needs: guard
    runs-on: windows-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-dir-*'
          ls -l assets
      - name: 매니페스트 생성 + pack
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          v="${TAG#v}"
          ./packaging/render-manifests.sh "$v" assets out
          mkdir -p out/choco/nupkg
          for pkg in nexa-dir nexa-dir.portable; do
            choco pack "out/choco/$pkg/$pkg.nuspec" --version "$v" --outputdirectory out/choco/nupkg
          done
          ls -l out/choco/nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: chocolatey-${{ inputs.tag }}
          path: out/choco/**
      - name: choco push(스위치 + 대기 판정 통과 시)
        if: needs.guard.outputs.choco_go == 'true'
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          v="${TAG#v}"
          for pkg in nexa-dir nexa-dir.portable; do
            choco push "out/choco/nupkg/$pkg.$v.nupkg" --source https://push.chocolatey.org/ --api-key "$CHOCO_API_KEY"
          done
          echo "제출 완료 — 커뮤니티 저장소는 검수를 거쳐야 노출된다(즉시 아님). 상태 = https://community.chocolatey.org/packages/nexa-dir/$v"
      - name: 건너뛴 이유 안내
        if: needs.guard.outputs.choco_go != 'true'
        shell: bash
        run: |
          echo "::notice::choco push하지 않았다(스위치 꺼짐·키 없음·또는 대기 판정)."
          echo "아티팩트 chocolatey-${{ inputs.tag }}의 nupkg를 받아 직접 push할 수 있다."

  winget:
    needs: guard
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 릴리스 자산 내려받기
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "${{ inputs.tag }}" --dir assets --pattern 'nexa-dir-*'
      - name: 매니페스트 생성 + 검증
        shell: bash
        env: { TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          ./packaging/render-manifests.sh "${TAG#v}" assets out
          find out/winget -name '*.installer.yaml' -exec dirname {} \; | sort -u > dirs.txt
          [ -s dirs.txt ] || { echo "::error::winget 매니페스트를 찾지 못했다"; exit 1; }
          while read -r d; do
            echo "== $d"; winget validate --manifest "$d" || exit 1
          done < dirs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: winget-${{ inputs.tag }}
          path: out/winget/**
      - name: winget-pkgs PR(스위치 + 대기 판정 통과 시)
        if: needs.guard.outputs.winget_go == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl.exe -L -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          find out/winget -name '*.installer.yaml' -exec dirname {} \; | sort -u > dirs.txt
          while read -r d; do
            ./wingetcreate.exe submit --token "$WINGET_TOKEN" "$d"
          done < dirs.txt
          echo "PR 생성 — microsoft/winget-pkgs의 자동 검증·리뷰를 거쳐야 노출된다."
      - name: 건너뛴 이유 안내
        if: needs.guard.outputs.winget_go != 'true'
        shell: bash
        run: |
          echo "::notice::winget PR을 만들지 않았다(스위치 꺼짐·토큰 없음·또는 직전 제출 검수 대기)."
          echo "아티팩트 winget-${{ inputs.tag }}를 microsoft/winget-pkgs에 직접 PR할 수 있다."
