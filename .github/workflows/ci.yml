# CI — "main은 항상 green"(docs/16 §3). 3-OS × fmt/clippy/test/smoke/selfcheck(docs/18 §8).
# ★ 형제 저장소 ../nexa-ui · ../nexa-license를 path 의존한다(DR-1·DR-4) → 나란히 체크아웃.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nexa-dir3

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-dir3
      # Linux 러너: 한글 글꼴(nexa-font 실측) — 빌드 자체는 시스템 라이브러리 불요(Wayland/X11 dlopen).
      - name: fonts (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core fonts-noto-core
        working-directory: .

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke
        run: cargo run -q -p nexa-dir -- --smoke
      - name: selfcheck (ci subset)
        run: cargo run -q -p nexa-dir -- --selfcheck --ci
      # T4 시나리오(실제 창 · docs/18 §4): Windows 러너는 데스크톱 세션이 있어 winit 창이 뜬다. Linux(xvfb)·macOS는 T-06 후속.
      - name: scenarios (T4 · windows)
        if: runner.os == 'Windows'
        run: cargo build -q -p nexa-dir && cargo run -q -p ndir-check -- --ci

  # T-07 · CI-113: 동봉 플러그인 소스(plugins/sdk)가 wasm32로 빌드되고, 그 산출물을 앱이 로드해 nx_meta id가 맞는지(자가 점검 plugin 그룹).
  # 바이트 동일성은 묻지 않는다(툴체인 차이) — 동봉본(plugins/*.wasm)은 dir2 dist 무수정이 회귀 기준(DR-7).
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexa-dir3
            nexa-dir3/plugins/sdk/markdown-viewer
            nexa-dir3/plugins/sdk/archive-viewer
      - name: build plugins (wasm32)
        run: scripts/plugin-build.sh --out-dir target/plugins-ci --skip-dist
      - name: fresh build loads (selfcheck plugin)
        run: NDIR_PLUGINS_DIR=target/plugins-ci cargo run -q -p nexa-dir -- --selfcheck --ci --only plugin
