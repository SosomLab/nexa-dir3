# CI — "main은 항상 green"(docs/16 §3). 3-OS × fmt/clippy/test/smoke/selfcheck(docs/18 §8).
# ★ 형제 저장소 ../nexa-ui · ../nexa-license를 path 의존한다(DR-1·DR-4) → 나란히 체크아웃.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nexa-dir3

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-dir3
      # Linux 러너: 한글 글꼴(nexa-font 실측) — 빌드 자체는 시스템 라이브러리 불요(Wayland/X11 dlopen).
      - name: fonts (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core fonts-noto-core
        working-directory: .

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: smoke
        run: cargo run -q -p nexa-dir -- --smoke
      - name: selfcheck (ci subset)
        run: cargo run -q -p nexa-dir -- --selfcheck --ci
      # T4 시나리오(실제 창 · docs/18 §4): Windows 러너는 데스크톱 세션이 있어 winit 창이 뜬다. Linux(xvfb)·macOS는 T-06 후속.
      - name: scenarios (T4 · windows)
        if: runner.os == 'Windows'
        run: cargo build -q -p nexa-dir && cargo run -q -p ndir-check -- --ci
      # T-117: Linux는 화면이 없어 xvfb 가상 화면에서 돈다(X 런타임 라이브러리는 winit이 dlopen — 러너에 없어 설치한다).
      # `.scn`의 `키@os:` 줄이 OS 분기를 담는다. 관찰 2회차(run 37231460856)에서 20/20 통과 → 필수 단계.
      - name: scenarios (T4 · linux xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxkbcommon0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
          cargo build -q -p nexa-dir
          xvfb-run -a -s "-screen 0 1280x900x24" cargo run -q -p ndir-check -- --ci
      - name: scenarios 산출물(linux)
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: t4-linux
          path: nexa-dir3/tests/out
          if-no-files-found: ignore
      # 예산 게이트(dir2 B2/B3 · docs/port/44 §3-4 ② · T-82): 릴리스 exe ≤ 10 MB(실측 10-03 5.2 MB) + 임포트 = OS 인박스 DLL만(정적 CRT).
      - name: budget (release exe ≤ 10 MB · imports inbox only · windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -q --release -p nexa-dir
          if ($LASTEXITCODE -ne 0) { throw "release build 실패" }
          $exe = Get-Item target\release\nexa-dir.exe
          "nexa-dir.exe {0:N0} bytes" -f $exe.Length
          if ($exe.Length -gt 10MB) { throw ("예산 초과: {0:N0} > 10 MB" -f $exe.Length) }
          pwsh -NoProfile -File scripts/check-imports.ps1 $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "임포트 게이트 실패" }

  # T-07 · CI-113: 동봉 플러그인 소스(plugins/sdk)가 wasm32로 빌드되고, 그 산출물을 앱이 로드해 nx_meta id가 맞는지(자가 점검 plugin 그룹).
  # 바이트 동일성은 묻지 않는다(툴체인 차이) — 동봉본(plugins/*.wasm)은 dir2 dist 무수정이 회귀 기준(DR-7).
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nexa-dir3
            nexa-dir3/plugins/sdk/markdown-viewer
            nexa-dir3/plugins/sdk/archive-viewer
      - name: build plugins (wasm32)
        run: bash scripts/plugin-build.sh --out-dir target/plugins-ci --skip-dist
      - name: fresh build loads (selfcheck plugin)
        run: NDIR_PLUGINS_DIR=target/plugins-ci cargo run -q -p nexa-dir -- --selfcheck --ci --only plugin
