# release — 태그 `v*` push → 3-OS 설치본(MSI+포터블 zip · pkg+dmg · deb+rpm) + sha256sums.txt + 패키지 매니페스트 zip → GitHub Release
# **즉시 공개**(태그) · 수동 실행은 초안 → 공개 뒤 homebrew · winget/choco 제출 · pkg.sosomlab.com 신호(T-82 · T-160 · docs/port/44 §3-4).
# 게시 흐름 이식 원천: ../nexa-clip/.github/workflows/release.yml(f3a6781) — 매니페스트는 render-manifests.sh 한 곳에서.
#
# 원칙: 설치본 + Windows 포터블 zip(dir2 채널 유지) · exe 1개(nexa-dir) · macOS Universal 2 `.app` + pkg(/usr/local/bin/nexa-dir 링크) · Windows MSI(WiX v4).
# 스크립트가 원장이다 — 이 워크플로는 `packaging/<os>/build-*.sh|ps1`을 부르기만 한다(로컬과 CI가 같은 명령 · 갈라짐 0).
# 이식 원천: ../nexa-sql/.github/workflows/release.yml(meta 잡 · 매트릭스 · 설치 스모크 · gh release) — 제품 토큰만 바꾸고 nsql CLI 단계를 뺐다.
#   ci.yml은 손대지 않는다(main green 검사는 그대로).
# ★ nexa-dir3은 형제 저장소 ../nexa-ui · ../nexa-license를 path 의존한다(DR-4·DR-25) → ci.yml과 같이 세 저장소를 나란히 체크아웃한다.
#
# 서명(DR-20 · 자리만): 아래 시크릿이 있을 때만 각 스크립트가 서명/공증한다 — 없으면 unsigned 산출물 + 릴리스 노트 안내.
#   macOS   MACOS_CERT_P12(base64) · MACOS_CERT_PASSWORD · MACOS_SIGN_IDENTITY · MACOS_INSTALLER_IDENTITY · MACOS_NOTARY_* (notarytool)
#   Windows WINDOWS_SIGN_PFX(base64) · WINDOWS_SIGN_PFX_PASSWORD
# 스모크: 설치 → `nexa-dir --version` · `nexa-dir --smoke` → 제거 → 잔여 파일 0 — 러너에서 실제 설치한다(Linux rpm은 목록만).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그(예: v0.23.0) — 없으면 커밋 SHA로 초안 생성"
        required: false
        type: string
      publish:
        description: "수동 실행도 초안 대신 바로 공개(태그 push는 늘 공개)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # 릴리스 생성·자산 업로드

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: nexa-dir3

jobs:
  # ── 버전 산정: 태그 → 0.1.0 / 수동 → 0.0.0-dev.<sha>. 태그 ≠ Cargo.toml 버전이면 멈춘다. ──
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          input_tag="${{ inputs.tag }}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          elif [ -n "$input_tag" ]; then tag="$input_tag"
          else tag="v0.0.0-dev.${GITHUB_SHA::7}"; fi
          version="${tag#v}"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"; echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "릴리스 $tag (버전 $version · prerelease=$pre)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cargo_v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            [ "$cargo_v" = "$version" ] || { echo "::error::태그 $version ≠ Cargo.toml $cargo_v"; exit 1; }
          fi

  # ── 3-OS 빌드 + 포장 + 설치 스모크 ──
  package:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 2.35 하한 — 배포판 비종속(zig 2.17 링크)은 후속(nexa-clip 방식)
            slug: linux
          - os: windows-latest
            slug: windows
          - os: macos-latest # Apple Silicon 러너 · x86_64 타깃은 크로스 빌드 → lipo Universal 2
            slug: macos
    runs-on: ${{ matrix.os }}
    env:
      NDIR_VERSION: ${{ needs.meta.outputs.version }}
      # rust-toolchain.toml(5 타깃 목록)을 rustc 프록시가 보고 자동 설치하다 러너의 rust-src와 충돌했다(v0.1.0 첫 실행 macOS ·
      # `detected conflict: lib/rustlib/src/rust/library/.cargo/config.toml`) — 포장은 설치한 stable + 명시적으로 더한 타깃만 쓴다.
      RUSTUP_TOOLCHAIN: stable
      # 서명 시크릿 — 비어 있으면 스크립트가 unsigned로 진행한다.
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
      WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/checkout@v4
        with:
          repository: SosomLab/nexa-ui
          path: nexa-ui
      - uses: actions/checkout@v4 # 형제 저장소 ../nexa-license(공개 · 검증 전용 · DR-25) — ndir-license가 path 의존
        with:
          repository: SosomLab/nexa-license
          path: nexa-license
      # rust-toolchain.toml이 요구하는 구성 요소(rustfmt·clippy)를 여기서 미리 채운다 — 빠지면 첫 cargo 호출 때 rustup이 다시 설치하다
      # 러너에 깔린 rust-src와 충돌한다(`detected conflict: lib/rustlib/src/rust/library/.cargo/config.toml` · v0.1.0 첫 실행 linux·macos · ci.yml과 같게).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexa-dir3
          key: release-${{ matrix.slug }}

      # ── Linux: 포장 도구 + 폰트(--smoke가 nexa-font로 한글 폰트를 찾는다 · ci.yml과 같은 세트) ──
      - name: Linux 도구
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rpm fonts-noto-cjk fonts-dejavu-core fonts-noto-core
      - name: Linux deb + rpm
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build-deb.sh
          packaging/linux/build-rpm.sh
      - name: Linux 스모크(설치 → nexa-dir --version · --smoke → 제거 → 잔여 0)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb=$(ls target/packaging/linux/*.deb)
          sudo dpkg -i "$deb"
          nexa-dir --version | tee /dev/stderr | grep -q "^nexa-dir $NDIR_VERSION\$"
          nexa-dir --smoke
          test -f /usr/share/applications/nexa-dir.desktop
          test -d /usr/share/nexa-dir/plugins
          sudo dpkg -r nexa-dir
          # `! cmd`는 set -e를 타지 않는다 — 부정은 test 안에서.
          test ! -e /usr/bin/nexa-dir; test ! -e /usr/share/nexa-dir
          # rpm은 ubuntu에 설치할 수 없다 — 목록·서명 검사만(rpm 계열 실기는 docs/port/90 실기표).
          rpm=$(ls target/packaging/linux/*.rpm)
          rpm -qpl "$rpm" | grep -q '^/usr/bin/nexa-dir$'
          rpm -K --nosignature "$rpm"

      # ── macOS: Universal 2 .app → pkg + dmg ──
      - name: macOS 타깃
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: macOS 서명 키체인(시크릿 있을 때만 · DR-20 자리)
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm -f /tmp/cert.p12
      - name: macOS app + pkg + dmg
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build-app.sh
          packaging/macos/build-pkg.sh
          packaging/macos/build-dmg.sh
      - name: macOS 스모크(pkg 설치 → /usr/local/bin/nexa-dir --version · --smoke → uninstall.sh → 잔여 0)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pkg=$(ls target/packaging/macos/*.pkg)
          sudo installer -pkg "$pkg" -target / -verbose
          test -L /usr/local/bin/nexa-dir
          /usr/local/bin/nexa-dir --version | tee /dev/stderr | grep -q "^nexa-dir $NDIR_VERSION\$"
          "/Applications/Nexa Dir.app/Contents/MacOS/nexa-dir" --smoke
          pkgutil --pkg-info com.sosomlab.nexa-dir
          sudo "/Applications/Nexa Dir.app/Contents/Resources/uninstall.sh"
          # `! cmd`는 set -e를 타지 않는다 — 부정은 test 안에서 / if로.
          test ! -e "/Applications/Nexa Dir.app"; test ! -e /usr/local/bin/nexa-dir
          if pkgutil --pkg-info com.sosomlab.nexa-dir >/dev/null 2>&1; then echo "::error::pkg 영수증이 남았다"; exit 1; fi

      # ── Windows: MSI(WiX v4) ──
      - name: Windows 서명 인증서(시크릿 있을 때만 · DR-20 자리)
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_PFX_PASSWORD != ''
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX }}
        run: |
          $p = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX_B64))
          "WINDOWS_SIGN_PFX=$p" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Windows MSI + 포터블 zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build-msi.ps1
          ./packaging/windows/build-zip.ps1
      - name: Windows 스모크(msiexec /qn → nexa-dir --version · --smoke → /x → 잔여 0)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = (Get-ChildItem target\packaging\windows\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "msiexec /i 실패 $($p.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles "Nexa Dir"
          # 창 프로그램(windows_subsystem)이라 `$v = & exe` 캡처는 PowerShell이 기다리지 않는다 → Start-Process -Wait + 파일로 받는다.
          $exe = Join-Path $dir "nexa-dir.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput ver.txt
          $v = (Get-Content ver.txt -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $v -ne "nexa-dir $env:NDIR_VERSION") { throw "버전 불일치: '$v' (exit $($p.ExitCode))" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke.txt -RedirectStandardError smoke.err
          Get-Content smoke.txt; if ($p.ExitCode -ne 0) { Get-Content smoke.err; throw "--smoke 실패 $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir "plugins\markdown.wasm"))) { throw "동봉 플러그인 누락" }
          (Get-ItemProperty 'HKLM:\SOFTWARE\SosomLab\Nexa Dir').InstallDir
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x 실패 $($p.ExitCode)" }
          # 제거는 끝났어도 파일 핸들이 늦게 풀릴 수 있다 — 잠깐 기다린 뒤 판정하고, 남으면 무엇이 남았는지 찍는다.
          foreach ($i in 1..10) { if (-not (Test-Path $dir)) { break }; Start-Sleep -Seconds 1 }
          if (Test-Path $dir) {
            Get-ChildItem -Force -Recurse $dir | ForEach-Object { "잔여: " + $_.FullName }
            throw "제거 후 잔여: $dir"
          }

      - name: 산출물 모으기
        shell: bash
        run: |
          mkdir -p out
          find target/packaging -maxdepth 2 \( -name '*.msi' -o -name '*.zip' -o -name '*.pkg' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.productcode.txt' \) -exec cp {} out/ \;
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.slug }}
          path: nexa-dir3/out/*
          if-no-files-found: error

  # ── 릴리스 게시(태그 = 즉시 공개 · 수동 = 초안) — 매니페스트(winget · choco · brew)는 여기서 만들어 자산으로 붙여 두고 제출은 전용 워크플로 ──
  publish:
    needs: [meta, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nexa-dir3
      - uses: actions/download-artifact@v4
        with:
          path: nexa-dir3/staged
          pattern: dist-*
          merge-multiple: true
      - name: 매니페스트 생성(render-manifests.sh 한 곳 · 영어/ASCII · copyright · 자리표시자 게이트)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ./packaging/render-manifests.sh "$VERSION" staged manifests
          (cd manifests && zip -qr "../staged/nexa-dir-$VERSION-package-manifests.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: nexa-dir3/manifests/**
          if-no-files-found: error
      - name: 크기 게이트(exe 예산 10 MB · MSI 30 MB)
        run: |
          set -euo pipefail
          msi=$(ls staged/*.msi); sz=$(stat -c %s "$msi")
          [ "$sz" -le $((30 * 1024 * 1024)) ] || { echo "::error::MSI $sz B > 30 MB"; exit 1; }
          echo "MSI $sz B"
      - name: sha256sums.txt
        run: |
          set -euo pipefail
          cd staged && sha256sum * > sha256sums.txt && cat sha256sums.txt
      - name: 릴리스 노트
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          # Nexa Dir $VERSION

          크로스플랫폼 경량 듀얼 패널 파일 탐색기(nexa-dir2 후속 · Windows·macOS·Linux 같은 화면) — 설치본 + Windows 포터블 zip.

          | 운영체제 | 파일 | 설치 |
          | --- | --- | --- |
          | Windows x64 | \`nexa-dir-$VERSION-windows-x64.msi\` | 더블클릭 또는 \`msiexec /i … /qn\`(조용한 설치 · PATH 추가 옵션) |
          | macOS (Universal · Apple Silicon/Intel) | \`nexa-dir-$VERSION-macos-universal.pkg\` | 설치기 실행 → \`/Applications/Nexa Dir.app\` + \`/usr/local/bin/nexa-dir\` 링크 |
          | macOS (drag-to-Applications) | \`nexa-dir-$VERSION-macos-universal.dmg\` | 끌어 놓기 · CLI 링크는 dmg 안 안내문 |
          | Linux x86_64 (deb) | \`nexa-dir_${VERSION}_amd64.deb\` | \`sudo dpkg -i\` 또는 \`sudo apt install ./…deb\` |
          | Linux x86_64 (rpm) | \`nexa-dir-$VERSION-1.x86_64.rpm\` | \`sudo dnf install ./…rpm\` |
          | Windows x64 (portable) | \`nexa-dir-$VERSION-windows-x64-portable.zip\` | 압축 해제 후 \`nexa-dir.exe\` 실행(실행 파일 옆에 \`data\` 폴더를 두면 거기에, 아니면 %APPDATA%\\\\nexa-dir에 설정) |

          받은 파일은 \`sha256sums.txt\`로 확인하세요. 제거: Windows 프로그램 추가/제거 · macOS \`sudo "/Applications/Nexa Dir.app/Contents/Resources/uninstall.sh"\` · Linux \`dpkg -r nexa-dir\`/\`dnf remove nexa-dir\`.
          사용자 데이터(설정 · 세션 · 즐겨찾기 · 이름 변경 프리셋)는 설정 폴더에 있으며 제거해도 보존됩니다. 0.22.0 이하(nexa-dir2)의 설정은 첫 실행 때 한 번 가져옵니다.

          ## 패키지 관리자

          \`\`\`powershell
          winget install SosomLab.NexaDir            # Windows MSI (replaces the 0.22.0 Inno installer)
          winget install SosomLab.NexaDir.Portable   # Windows portable
          choco  install nexa-dir                    # Windows MSI
          choco  install nexa-dir.portable           # Windows portable
          \`\`\`
          \`\`\`bash
          brew install --cask kiros33/tap/nexa-dir   # macOS (Universal pkg)
          \`\`\`
          Linux(apt/rpm 저장소): <https://pkg.sosomlab.com>

          winget·Chocolatey는 중앙 검수를 거쳐야 위 명령이 동작합니다. 함께 올린 \`nexa-dir-$VERSION-package-manifests.zip\`이 실제 제출본입니다.

          ## 서명

          코드 서명 키가 투입되지 않은 빌드는 macOS Gatekeeper·Windows SmartScreen이 경고합니다(DR-20 · 별도 요청 시 서명).
          - macOS: \`xattr -dr com.apple.quarantine "/Applications/Nexa Dir.app"\`(brew Cask로 설치하면 자동)
          - Windows: SmartScreen "추가 정보 → 실행"

          변경 내역: [docs/DEVLOG.md](https://github.com/SosomLab/nexa-dir3/blob/main/docs/DEVLOG.md)

          License: PolyForm Noncommercial 1.0.0 — free for noncommercial use only; commercial use requires a license.
          라이선스: PolyForm Noncommercial 1.0.0 (비상업적 사용만 허용 · 상업 사용은 라이선스 필요).
          EOF
      - name: 릴리스 게시(태그 = 공개 · 수동 = 초안)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--title "Nexa Dir ${TAG#v}" --notes-file notes.md --target "$GITHUB_SHA")
          [ "$PRE" = "true" ] && args+=(--prerelease)
          if [ "${{ github.ref_type }}" != "tag" ] && [ "${{ inputs.publish }}" != "true" ]; then
            args+=(--draft)
            echo "수동 실행이라 초안으로 만든다 — GitHub에서 'Publish release'를 눌러 공개한다."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 이미 있는 릴리스에 자산을 덧쓰지 않는다(linux-repo가 서명 색인에 넣은 뒤 바뀌면 색인이 깨진다) — 없는 자산만 올린다.
            have=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for f in staged/*; do
              n=$(basename "$f")
              if echo "$have" | grep -qx "$n"; then echo "건너뜀(이미 있음): $n"; else gh release upload "$TAG" "$f"; fi
            done
          else
            gh release create "$TAG" staged/* "${args[@]}"
          fi

  # ── 패키지 관리자 제출(릴리스 공개 뒤에만 — 매니페스트가 자산 URL·해시를 가리킨다) ──
  homebrew:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit

  windows-packages:
    needs: [meta, publish]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish-windows-packages.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit

  # ── Linux 패키지 저장소(pkg.sosomlab.com) 갱신 신호 — SosomLab/linux-repo의 publish가 받아 서명 색인을 다시 만든다(정식 공개만 ·
  #    `on: release: published`는 GITHUB_TOKEN이 만든 릴리스에서 발화하지 않으므로 여기서 직접 보낸다 · 첫 공개 뒤 apps/nexa-dir.toml 등록) ──
  linux-repo:
    needs: [meta, publish]
    if: github.ref_type == 'tag' && needs.meta.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        working-directory: .
    steps:
      - name: pkg.sosomlab.com 갱신 신호
        env:
          TOKEN: ${{ secrets.LINUX_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then echo "::notice::LINUX_REPO_DISPATCH_TOKEN 없음 — linux-repo 정기 실행이 반영"; exit 0; fi
          curl -fsS -X POST https://api.github.com/repos/SosomLab/linux-repo/dispatches \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"event_type\":\"app-released\",\"client_payload\":{\"app\":\"nexa-dir\",\"tag\":\"$GITHUB_REF_NAME\",\"repo\":\"$GITHUB_REPOSITORY\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}}"
