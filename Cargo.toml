# Nexa Dir 3 — 크로스플랫폼 파일 탐색기 (올 러스트 · nexa-ui 위에 그린다 · nexa-dir2 기능 계승)
# 아키텍처 = docs/01 · 결정 = docs/10 · 개발 기준 = docs/15 · 빌드/테스트 = docs/18.
# 크레이트 경계는 단방향(docs/15 §2-1) — 라이브러리 크레이트는 창·OS API를 모른다.
[workspace]
resolver = "2"
members = [
  "crates/ndir-core",     # dir2 nexa-core — FileKind · Secret (의존 0)
  "crates/ndir-vfs",      # dir2 nexa-vfs — 열거 · 가상 최상위 · 압축 스트림 (의존: core)
  "crates/ndir-tree",     # dir2 nexa-tree — 인라인 트리 평면 스트림 · 정렬 · 필터 (의존: core · vfs)
  "crates/ndir-ops",      # dir2 nexa-ops — 전송 · 히스토리 · 일괄 이름 변경 (의존: regex-lite)
  "crates/ndir-term",     # dir2 nexa-term — VT 파서 · 화면 버퍼 · 복사 서식 (의존 0)
  "crates/ndir-i18n",     # 메시지 카탈로그 — dir2 lang/*.lang 임베드 · 오버레이 · OS 언어 · 빌드 검사 (의존 0 · DR-14)
  "crates/ndir-settings", # 앱 설정 — nsql-settings 엔진 + dir2 키 표 · settings.conf · JSON · dir2 가져오기 (의존: i18n · nexa-conf · DR-3)
  "crates/nexa-dir",      # (bin) 앱 — winit 호스트 · app/ 조각 · platform/ · preview/
]
# 플러그인 게스트 작업 공간(wasm32)은 따로 빌드한다(docs/18 · scripts/plugin-build.*).
exclude = ["plugins/sdk"]

[workspace.package]
# ★ 버전 자리는 여기 하나(DR-6). dir2 0.22.0의 다음 = 0.23.0(제품 연속 · 라이선스 max_major 0 호환).
version = "0.23.0"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["Sangyong Bae <kiros33@gmail.com>"]
repository = "https://github.com/SosomLab/nexa-dir3"
homepage = "https://sosomlab.com"

# 워크스페이스 공통 린트 — 각 크레이트 [lints] workspace = true로 상속(nexa-sql 판).
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
inefficient_to_string = "warn"
unwrap_used = "warn"

[workspace.dependencies]
ndir-core = { path = "crates/ndir-core" }
ndir-vfs = { path = "crates/ndir-vfs" }
ndir-tree = { path = "crates/ndir-tree" }
ndir-ops = { path = "crates/ndir-ops" }
ndir-term = { path = "crates/ndir-term" }
ndir-i18n = { path = "crates/ndir-i18n" }
ndir-settings = { path = "crates/ndir-settings" }
# nexa-ui(공용 UI · 형제 저장소 · 경로 의존 — DR-1·2). M1에서 소비 시작.
nexa-gfx = { path = "../nexa-ui/crates/nexa-gfx" }
nexa-ctl = { path = "../nexa-ui/crates/nexa-ctl" }
nexa-conf = { path = "../nexa-ui/crates/nexa-conf" }
nexa-font = { path = "../nexa-ui/crates/nexa-font" }
nexa-fs = { path = "../nexa-ui/crates/nexa-fs" }
nexa-dlg = { path = "../nexa-ui/crates/nexa-dlg" }
# 기본 = 신호만(GUI 프레임워크 링크 없음) · GUI 크레이트가 features = ["gui"]를 켠다.
nexa-sys = { path = "../nexa-ui/crates/nexa-sys", default-features = false }
# nexa-license(공용 라이선스 라이브러리 · 형제 저장소 · 검증 전용 — DR-4).
nexa-license = { path = "../nexa-license/crates/nexa-license" }
# WASM 플러그인 런타임(DR-7) — dir2·nexa-sql과 같은 판.
wasmi = "1.1"

# 릴리스 = 단일 바이너리 최적화(dir2 프로필 계승)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# ★ 개발 빌드도 화면은 빠르게(nexa-sql 09-24 실측 — Debug 프레임 94 ms): 의존 크레이트(래스터·컨트롤·글꼴·softbuffer·wasmi)는
#   최적화하고 이 저장소의 크레이트는 디버그 그대로. 첫 빌드만 의존 전부를 다시 컴파일한다.
[profile.dev.package."*"]
opt-level = 2
